{{- include "app-baseline.validateAccess" $ -}}
{{- range $env := .Values.environments }}
{{- if eq $env.cluster $.Values.targetCluster }}
{{- $namespaceAccess := list }}
{{- range $.Values.access }}
{{- if has $env.cluster .clusters }}
{{- $namespaceAccess = append $namespaceAccess . }}
{{- end }}
{{- end }}
{{- if $namespaceAccess }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-api-routes-read
  namespace: {{ $env.namespace }}
  labels:
    container-platform/bu: {{ $.Values.bu | quote }}
    container-platform/product: {{ $.Values.product | quote }}
    container-platform/managed-by: "app-baseline"
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch"]
{{- range $namespaceAccess }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .group }}-gateway-api-routes
  namespace: {{ $env.namespace }}
  labels:
    container-platform/bu: {{ $.Values.bu | quote }}
    container-platform/product: {{ $.Values.product | quote }}
    container-platform/managed-by: "app-baseline"
subjects:
  - kind: Group
    name: {{ .group }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: gateway-api-routes-read
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
{{- end }}
{{- end }}