# Values injected by the baseline ApplicationSet from product.yaml
product: ""
bu: ""
targetCluster: ""

owner:
  team: ""
  slack: ""

# Environment declarations from product.yaml — filtered by targetCluster in templates.
# Each environment on the target cluster produces a Namespace + default-deny NetworkPolicy.
environments: []
  # - name: dev
  #   cluster: container-platform-octo-nonlive
  #   namespace: helloworld-dev
  #   is_production: false

# Access declarations from product.yaml — creates RoleBindings per namespace.
#
# Supported roles (built-in Kubernetes ClusterRoles):
#   - view:  read-only access to most objects (excludes Secrets)
#   - edit:  read/write access to most objects (includes Secrets)
#   - admin: edit + ability to create Roles and RoleBindings
#
# Live environments should default to view-only. Edit/admin on live requires
# justification and is expected to be rare — workloads should deploy via Argo CD.
#
# Group naming convention: github-<org>-<team>
#   e.g. github-laa-developers, github-hmpps-dev-team
access: []
  # - group: github-laa-developers
  #   role: edit
  #   clusters:
  #     - container-platform-laa-nonlive
  # - group: github-laa-developers
  #   role: view
  #   clusters:
  #     - container-platform-laa-live
