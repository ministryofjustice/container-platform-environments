{{- if .Values.database.enabled }}
# Public AWS RDS trust anchors for eu-west-2, used to verify the database TLS certificate.
# Source: the Europe (London) PEM bundle listed in the certificate bundles table at
# https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.SSL.html#UsingWithRDS.SSL.CertificatesAllRegions
# Public certificates, so a ConfigMap rather than a Secret. Credentials live in the test-app-db Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.database.caConfigMapName }}
  labels:
    app: test-app-backend
data:
  rds-ca.pem: |
{{ .Files.Get "files/rds-ca.pem" | indent 4 }}
{{- end }}
