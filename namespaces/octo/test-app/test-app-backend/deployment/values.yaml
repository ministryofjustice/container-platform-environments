# Default values for test-app-backend. Overridden per environment by values/<tier>/<env>.yaml
replicaCount: 1

# Image is pinned by digest (not tag) for supply-chain integrity.
image:
  repository: ghcr.io/ministryofjustice/container-platform-test-app-backend
  digest: sha256:851b54399be0e21963beb3a4947d050f03b8985bf4aec80c13a89232ad83204c

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

service:
  port: 8080
  targetPort: 8080
