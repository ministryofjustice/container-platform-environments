# Default values for test-app-frontend. Overridden per environment by values/<tier>/<env>.yaml
replicaCount: 1

# Image is pinned by digest (not tag) for supply-chain integrity.
image:
  repository: ghcr.io/ministryofjustice/container-platform-test-app-frontend
  digest: sha256:f431d209a324e66788ed58e52d498f83a94312c05880ec69c8dfdc3ff992cb62

# Backend Service DNS the frontend calls (matches the backend Service name + port).
backendUrl: http://test-app-backend:8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

service:
  port: 80
  targetPort: 8080

gateway:
  name: default
  namespace: envoy-gateway-system
