apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: test-app-frontend-allow-gateway
  labels:
    app: test-app-frontend
spec:
  podSelector:
    matchLabels:
      app: test-app-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.gateway.namespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
