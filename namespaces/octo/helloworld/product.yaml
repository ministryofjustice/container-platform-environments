product: helloworld
bu: octo
owner:
  team: cloud-platform
  slack: "#cloud-platform"
  source: https://github.com/ministryofjustice/container-platform-environments

# Environments map a logical stage (dev/staging/prod) to a cluster + namespace.
# Multiple environments can share a cluster (e.g. dev + staging on nonlive)
# while remaining isolated in separate namespaces.
environments:
  - name: dev
    cluster: container-platform-octo-nonlive
    namespace: helloworld-dev
    is_production: false
  - name: staging
    cluster: container-platform-octo-nonlive
    namespace: helloworld-staging
    is_production: false
  - name: prod
    cluster: container-platform-octo-live
    namespace: helloworld-prod
    is_production: true

# Access declarations — one permission set + EKS Access Entry per group.
# RoleBindings are created in every namespace on the listed clusters.
access:
  - group: cloud-platform-engineers
    role: edit
    clusters:
      - container-platform-octo-nonlive
      - container-platform-octo-live
  - group: cloud-platform
    role: edit
    clusters:
      - container-platform-octo-nonlive
