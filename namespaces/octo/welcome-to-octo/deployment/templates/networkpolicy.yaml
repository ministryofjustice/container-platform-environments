apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: welcome-to-octo-allow-gateway
  labels:
    app: welcome-to-octo
spec:
  podSelector:
    matchLabels:
      app: welcome-to-octo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}