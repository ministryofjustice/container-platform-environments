apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: davidb-nginx-demo-allow-gateway
  labels:
    app: davidb-nginx-demo
spec:
  podSelector:
    matchLabels:
      app: davidb-nginx-demo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}