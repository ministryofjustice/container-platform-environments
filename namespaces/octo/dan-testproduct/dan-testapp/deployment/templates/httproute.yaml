apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dan-testapp
spec:
  parentRefs:
    - name: default-listenerset
      namespace: envoy-gateway-system
      kind: ListenerSet
      group: gateway.networking.k8s.io
      sectionName: https
  hostnames:
    - {{ required "host must be configured" .Values.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dan-testapp
          port: {{ .Values.service.port }}