apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Chart.Name }}-allow-gateway
  labels:
    app: {{ .Chart.Name }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Chart.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    {{- if .Values.kong }}
    - from:
        - namespaceSelector:
            matchLabels:
              component: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.service.metricsPort }}
    {{- end }}