{{- if .Values.benchmarkBackend.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Chart.Name }}-benchmark-backend
  labels:
    app: {{ .Chart.Name }}-benchmark-backend
spec:
  podSelector:
    matchLabels:
      app: {{ .Chart.Name }}-benchmark-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespace }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
