---
namespace: integration-hub-api-development
host: kong-gateway-dev.octo-nonlive.container-platform.service.justice.gov.uk

replicaCount: 2

image:
  repository: kong
  tag: "3.9.3"
  digest: "sha256:92035d16d7ff86b7bc12fb1d0090d29357d924238b1880f78735f3f2fea6b631"

service:
  targetPort: 8000

containerSecurityContext:
  runAsUser: 1001

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

kong:
  declarativeConfig: |
    _format_version: "3.0"
    services:
      - name: api-a
        url: http://httpbin.org/anything
        plugins:
          - name: key-auth
          - name: acl
            config:
              allow:
                - dashboard
        routes:
          - name: api-a-route
            paths:
              - /a
      - name: api-fail
        url: http://httpbin.org/status/503
        plugins:
          - name: key-auth
        routes:
          - name: api-fail-route
            paths:
              - /fail
      - name: ping
        url: http://localhost:8000
        routes:
          - name: ping-route
            paths:
              - /ping
            plugins:
              - name: request-termination
                config:
                  status_code: 200
                  message: ok
              - name: rate-limiting
                config:
                  minute: 1000000
                  policy: local
      - name: api-b
        url: http://httpbin.org/anything
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
        routes:
          - name: api-b-route
            paths:
              - /b
    plugins:
      - name: rate-limiting
        config:
          minute: 5
          limit_by: consumer
          policy: local
      - name: file-log
        config:
          path: /dev/stdout
      - name: prometheus
        config:
          per_consumer: true
          status_code_metrics: true
          latency_metrics: true
          bandwidth_metrics: true
    consumers:
      - username: case-dashboard
        acls:
          - group: dashboard
        keyauth_credentials:
          - key: dashboard-test-key-123
        jwt_secrets:
          - key: case-dashboard-issuer
            algorithm: HS256
            secret: local-trial-only-jwt-secret-0123456789
      - username: reporting
        acls:
          - group: reporting
        keyauth_credentials:
          - key: reporting-test-key-456
