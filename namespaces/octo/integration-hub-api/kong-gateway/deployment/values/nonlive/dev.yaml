---
namespace: integration-hub-api-development
host: kong-gateway-dev.octo-nonlive.container-platform.service.justice.gov.uk

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

benchmarkBackend:
  enabled: true

image:
  repository: kong
  tag: "3.9.3"
  digest: "sha256:92035d16d7ff86b7bc12fb1d0090d29357d924238b1880f78735f3f2fea6b631"

service:
  targetPort: 8000

containerSecurityContext:
  runAsUser: 1001

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

kong:
  declarativeConfig: |
    _format_version: "3.0"
    services:
      - name: api-a
        url: http://httpbin.org/anything
        plugins:
          - name: key-auth
          - name: acl
            config:
              allow:
                - dashboard
          - name: rate-limiting
            config:
              minute: 5
              limit_by: consumer
              policy: local
        routes:
          - name: api-a-route
            paths:
              - /a
      - name: api-fail
        url: http://httpbin.org/status/503
        plugins:
          - name: key-auth
          - name: rate-limiting
            config:
              minute: 5
              limit_by: consumer
              policy: local
        routes:
          - name: api-fail-route
            paths:
              - /fail
      - name: benchmark
        url: http://kong-gateway-benchmark-backend:8080
        routes:
          - name: benchmark-route
            hosts:
              - kong-benchmark.internal
            paths:
              - /benchmark
      - name: anonymous-rate-limit
        url: http://kong-gateway-benchmark-backend:8080
        routes:
          - name: anonymous-rate-limit-route
            paths:
              - /anonymous-rate-limit
            plugins:
              - name: rate-limiting
                config:
                  minute: 5
                  limit_by: ip
                  policy: local
      - name: ping
        url: http://localhost:8000
        routes:
          - name: ping-route
            paths:
              - /ping
            plugins:
              - name: request-termination
                config:
                  status_code: 200
                  message: ok
              - name: rate-limiting
                config:
                  minute: 1000000
                  policy: local
      - name: api-b
        url: http://httpbin.org/anything
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
          - name: rate-limiting
            config:
              minute: 5
              limit_by: consumer
              policy: local
        routes:
          - name: api-b-route
            paths:
              - /b
      - name: scale-test-api-01
        url: http://kong-gateway-benchmark-backend:8080
        plugins:
          - name: key-auth
          - name: rate-limiting
            config:
              minute: 5
              limit_by: consumer
              policy: local
        routes:
          - name: scale-test-api-01-route
            paths:
              - /scale-test/api-01
      - name: scale-test-api-02
        url: http://kong-gateway-benchmark-backend:8080
        plugins:
