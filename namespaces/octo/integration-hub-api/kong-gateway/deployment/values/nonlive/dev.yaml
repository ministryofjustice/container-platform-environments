    plugins:
      - name: file-log
        config:
          path: /dev/stdout
      - name: prometheus
        config:
          per_consumer: true
          status_code_metrics: true
          latency_metrics: true
          bandwidth_metrics: true
    consumers:
      - username: case-dashboard
        acls:
          - group: dashboard
        keyauth_credentials:
          - key: dashboard-test-key-123
        jwt_secrets:
          - key: case-dashboard-issuer
            algorithm: HS256
            secret: local-trial-only-jwt-secret-0123456789
      - username: reporting
        acls:
          - group: reporting
        keyauth_credentials:
          - key: reporting-test-key-456
      - username: scale-test-consumer-01
      - username: scale-test-consumer-02
      - username: scale-test-consumer-03
      - username: scale-test-consumer-04
