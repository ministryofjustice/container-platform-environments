product: jake-hello-world
bu: octo
owner:
  team: cloud-platform
  slack: "#cloud-platform"
  source: https://github.com/ministryofjustice/container-platform-environments
environments:
  - name: dev
    cluster: container-platform-octo-nonlive
    namespace: jake-hello-world-dev
    is_production: false

  - name: staging
    cluster: container-platform-octo-nonlive
    namespace: jake-hello-world-staging
    is_production: false

  - name: prod
    cluster: container-platform-octo-live
    namespace: jake-hello-world-prod
    is_production: true
access:
  - group: cloud-platform-engineers
    role: edit
    clusters:
      - container-platform-octo-nonlive
