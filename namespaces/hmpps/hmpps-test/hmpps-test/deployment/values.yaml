generic-service:
  nameOverride: hmpps-test
  productId: "UNASSIGNED"

  replicaCount: 4

  image:
    repository: ghcr.io/ministryofjustice/hmpps-template-kotlin
    tag: app_version
    port: 8080

  ingress:
    enabled: true
    host: app-hostname.local
    tlsSecretName: hmpps-test-cert
    path: /

  env:
    SERVER_PORT: "8080"
    APPLICATIONINSIGHTS_CONFIGURATION_FILE: applicationinsights.json

  namespace_secrets:
    hmpps-test-application-insights:
      APPLICATIONINSIGHTS_CONNECTION_STRING: "APPLICATIONINSIGHTS_CONNECTION_STRING"

generic-prometheus-alerts:
  targetApplication: hmpps-test