name: User Terraform Plan

on:
  push:
    branches:
      - jb-user-resource-workflow-testing
    paths:
      - 'namespaces/**/product.yaml'
      - 'namespaces/**/resources/**'
  workflow_dispatch:
    inputs:
      product_file:
        description: Product manifest to expand into a matrix
        required: true
        default: namespaces/octo/jake-hello-world/product.yaml
        type: string

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.environments.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: cmd/product-config/go.mod
          cache-dependency-path: cmd/product-config/go.sum

      - name: Define environments
        id: environments
        env:
          PRODUCT_FILE: ${{ inputs.product_file || 'namespaces/octo/jake-hello-world/product.yaml' }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        working-directory: cmd/product-config
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$PRODUCT_FILE" =~ ^namespaces/[^/]+/[^/]+/product\.yaml$ ]]; then
              echo "product_file must point to namespaces/<bu>/<product>/product.yaml" >&2
              exit 1
            fi
            matrix="$(go run . matrix "../../$PRODUCT_FILE")"
          else
            matrix="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" | go run . matrix-changes ../..)"
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  plan:
    needs: discover
    name: ${{ matrix.bu }} / ${{ matrix.product }} / ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Resolve target account (simulation only)
        env:
          PRODUCT: ${{ matrix.product }}
          BU: ${{ matrix.bu }}
          ENVIRONMENT: ${{ matrix.environment }}
          CLUSTER: ${{ matrix.cluster }}
          NAMESPACE: ${{ matrix.namespace }}
          IS_PRODUCTION: ${{ matrix.is_production }}
          STATE_KEY: products/${{ matrix.bu }}/${{ matrix.product }}/resources.tfstate
        run: |
          echo "Would target account: $CLUSTER"
          echo "Product: $PRODUCT ($BU)"
          echo "Environment: $ENVIRONMENT"
          echo "Namespace: $NAMESPACE"
          echo "Production: $IS_PRODUCTION"
          echo "Backend key: $STATE_KEY"

      - name: Authenticate to AWS (simulation only)
        env:
          TARGET_ACCOUNT: ${{ matrix.cluster }}
        run: echo "Would exchange GitHub OIDC for the allow-listed plan role in $TARGET_ACCOUNT"

      - name: Initialize Terraform backend (simulation only)
        env:
          STATE_KEY: products/${{ matrix.bu }}/${{ matrix.product }}/resources.tfstate
        run: echo "Would run terraform init with the platform state bucket and key $STATE_KEY"

      - name: Select or create workspace (simulation only)
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: echo "Would run terraform workspace select $ENVIRONMENT || terraform workspace new $ENVIRONMENT"

      - name: Plan resources (simulation only)
        env:
          PRODUCT: ${{ matrix.product }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: echo "Would run terraform plan for $PRODUCT in workspace $ENVIRONMENT"