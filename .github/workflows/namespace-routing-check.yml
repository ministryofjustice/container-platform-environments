name: Namespace Routing Check

on:
  pull_request:
    paths:
      - "namespaces/**"
      - ".github/workflows/namespace-routing-check.yml"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Validate namespace routing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # python3 + pyyaml are preinstalled on ubuntu-latest; no tool install needed.
      - name: Check namespace routing
        run: bash scripts/check-namespace-routing.sh
