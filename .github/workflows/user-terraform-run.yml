name: User Terraform

on:
  workflow_call:
    inputs:
      apply:
        description: 'Apply after plan'
        type: boolean
        default: false
      base-sha:
        description: 'PR base SHA or push before SHA'
        required: true
        type: string
      head-sha:
        description: 'PR head SHA or push after SHA'
        required: true
        type: string

permissions:
  contents: read

jobs:
  get-account-secret:
    permissions:
      id-token: write
    uses: ministryofjustice/cloud-platform-github-workflows/.github/workflows/get-aws-secret.yml@b67e7d66b0c8d739b54ecccd5b0c0da0a8dcfa36 # main
    with:
      secret_name: ENVIRONMENT_MANAGEMENT # sets the name for the environment variable in decrypt step
      secret_arn_ssm_parameter: environment_management_arn # secret arn is available as an ssm param
    secrets:
      AWS_ACCOUNT_NUMBER: ${{ secrets.CLOUD_PLATFORM_LIVE_ACCOUNT_ID }}
      AWS_ROLE_NAME: github-actions-container-platform-identity-secrets-${{ github.event_name == 'push' && 'apply' || 'plan' }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}

  discover:
    runs-on: ubuntu-latest
    needs: get-account-secret
    outputs:
      matrix: ${{ steps.environments.outputs.matrix }}
      has-targets: ${{ steps.environments.outputs.has-targets }}
    steps:
      - name: Validate apply context
        if: inputs.apply
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_SHA: ${{ inputs.head-sha }}
          RUN_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" != push || "$REF" != refs/heads/main || "$HEAD_SHA" != "$RUN_SHA" ]]; then
            echo "::error::Apply requires a push to main at the pushed commit"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: cmd/product-config/go.mod
          cache-dependency-path: cmd/product-config/go.sum

      - name: Define environments
        id: environments
        env:
          BASE_SHA: ${{ inputs.base-sha }}
          HEAD_SHA: ${{ inputs.head-sha }}
          EVENT_NAME: ${{ github.event_name }}
        working-directory: cmd/product-config
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            BASE_SHA="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          fi

          changed_paths="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          matrix="$(printf '%s\n' "$changed_paths" | go run . ../..)"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has-targets=$(jq -r '.include | length > 0' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  terraform:
    needs: [get-account-secret, discover]
    if: needs.discover.outputs.has-targets == 'true'
    name: ${{ matrix.bu }} - ${{ matrix.product }} (${{ matrix.environment }}) - ${{ inputs.apply && 'apply' || 'plan' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    concurrency:
      group: user-terraform-state-${{ matrix.bu }}/${{ matrix.product }}/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # This is just a temporary step to show the resolved target account and environment details
      - name: Resolve target account
        env:
          PRODUCT: ${{ matrix.product }}
          BU: ${{ matrix.bu }}
          ENVIRONMENT: ${{ matrix.environment }}
          CLUSTER: ${{ matrix.cluster }}
          NAMESPACE: ${{ matrix.namespace }}
          IS_PRODUCTION: ${{ matrix.is_production }}
          STATE_KEY: products/${{ matrix.bu }}/${{ matrix.product }}/resources.tfstate
        run: |
          echo "Target account: $CLUSTER"
          echo "Product: $PRODUCT ($BU)"
          echo "Environment: $ENVIRONMENT"
          echo "Namespace: $NAMESPACE"
          echo "Production: $IS_PRODUCTION"
          echo "Backend key: $STATE_KEY"

      - uses: ministryofjustice/cloud-platform-github-workflows/decrypt-secret@b67e7d66b0c8d739b54ecccd5b0c0da0a8dcfa36 # main
        with:
          encrypted_secret: ${{ needs.get-account-secret.outputs.encrypted_secret }}
          passphrase: ${{ secrets.PASSPHRASE }}
          secret_name: ENVIRONMENT_MANAGEMENT

      # this step can be removed once we have a real step to consume the account ID, it is just for demonstration purposes
      - name: Look up account ID
        id: account
        env:
          ACCOUNT_NAME: ${{ matrix.cluster }}
        run: |
          set -euo pipefail
          id=$(jq -r --arg n "$ACCOUNT_NAME" '.account_ids[$n] // empty' <<< "$ENVIRONMENT_MANAGEMENT")

          if [ -z "$id" ]; then
            echo "::error::No account ID found for '$ACCOUNT_NAME'"
            exit 1
          fi
          if [[ ! "$id" =~ ^[0-9]{12}$ ]]; then
            echo "::error::Account ID for '$ACCOUNT_NAME' is not a 12-digit number"
            exit 1
          fi

          echo "Resolved account ID for $ACCOUNT_NAME (${#id} digits)"
