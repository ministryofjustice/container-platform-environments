name: Identity Apply

on:
  push:
    paths:
      - "identity/terraform/**"
      - "identity/modules/**"
      - ".github/workflows/identity-apply.yml"
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ./identity/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: arn:aws:iam::${{secrets.CLOUD_PLATFORM_LIVE_ACCOUNT_ID}}:role/github-actions-container-platform-identity-apply
          role-session-name: GitHubActionsContainerPlatformIdentityApply
          aws-region: eu-west-2
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: 1.14.8
      - run: terraform init
      - run: terraform validate -no-color
      - name: Terraform plan
        run: |
          set -o pipefail
          terraform plan | ../../scripts/redaction.sh
      - name: Terraform apply
        run: |
          set -o pipefail
          terraform apply -auto-approve | ../../scripts/redaction.sh
        if: github.event.ref == 'refs/heads/main'
