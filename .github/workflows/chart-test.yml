name: Chart Test

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/chart-test.yml"
  workflow_dispatch:

permissions: {}

jobs:
  unittest:
    name: Helm unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # helm is preinstalled on the ubuntu-latest runner image; only the
      # unittest plugin needs adding. Pinned to a released version.
      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.2

      - name: Run chart unit tests
        run: |
          set -o pipefail
          for chart in charts/*/; do
            if [ -d "${chart}tests" ]; then
              echo "::group::helm unittest ${chart}"
              helm unittest "${chart}"
              echo "::endgroup::"
            fi
          done
